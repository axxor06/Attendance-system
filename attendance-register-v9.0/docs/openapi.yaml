openapi: 3.1.0
info:
  title: College Attendance Management API
  version: 5.1.0
  description: |
    REST API for the college attendance management system. Access tokens are sent
    as `Authorization: Bearer <token>`. Refresh tokens are rotated and stored in
    an HTTP-only cookie; clients must not read or persist refresh-token values.
servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://attendance.example.edu/api
    description: Production example

tags:
  - name: Authentication
  - name: Registration
  - name: Classes
  - name: Departments
  - name: Semesters
  - name: Subjects
  - name: Attendance
  - name: QR attendance
  - name: Reports
  - name: Search

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Start student email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify a student email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend an email or password-reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                purpose: { type: string, enum: [email_verification, password_reset] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and issue an access token plus rotated refresh cookie
      description: |
        Account-aware progressive login protection applies after repeated failures.
        A locked account returns HTTP 429 with a retry hint. Accounts with
        `passwordResetRequired` cannot sign in until the OTP reset flow completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Signed in; refresh token is set in an HTTP-only cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh session and issue a new access token
      security: [{ refreshCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh session
      security: [{ refreshCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Consume a reset OTP and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 4, maxLength: 8 }
                newPassword: { type: string, format: password, minLength: 12, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password and invalidate current access/refresh sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, writeOnly: true }
                newPassword: { type: string, format: password, minLength: 12, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /registration-requests:
    post:
      tags: [Registration]
      summary: Submit a student registration request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Registration]
      summary: List registration requests for review
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /registration-requests/status:
    get:
      tags: [Registration]
      summary: Check public registration-request status by email
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /registration-requests/{id}/approve:
    post:
      tags: [Registration]
      summary: Approve a pending registration request
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /registration-requests/{id}/reject:
    post:
      tags: [Registration]
      summary: Reject a pending registration request
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /classes/public-options:
    get:
      tags: [Classes]
      summary: Return active classes for public registration
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /classes:
    get:
      tags: [Classes]
      summary: List classes
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - { in: query, name: department, schema: { type: string, format: objectId } }
        - { in: query, name: semester, schema: { type: string, format: objectId } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
    post:
      tags: [Classes]
      summary: Create a class
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /classes/{id}:
    get:
      tags: [Classes]
      summary: Get a class
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      tags: [Classes]
      summary: Update a class
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Classes]
      summary: Delete a class
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '204': { description: Deleted } }

  /departments:
    get:
      tags: [Departments]
      summary: List departments
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/PaginatedSuccess' } }
    post:
      tags: [Departments]
      summary: Create a department
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /semesters:
    get:
      tags: [Semesters]
      summary: List semesters
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/PaginatedSuccess' } }
    post:
      tags: [Semesters]
      summary: Create a semester
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /subjects:
    get:
      tags: [Subjects]
      summary: List subjects with bounded pagination
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - { in: query, name: department, schema: { type: string, format: objectId } }
        - { in: query, name: semester, schema: { type: string, format: objectId } }
        - { in: query, name: classId, schema: { type: string, format: objectId } }
        - { in: query, name: facultyId, schema: { type: string, format: objectId } }
      responses: { '200': { $ref: '#/components/responses/PaginatedSuccess' } }
    post:
      tags: [Subjects]
      summary: Create a subject
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /subjects/my-subjects:
    get:
      tags: [Subjects]
      summary: List subjects assigned to the authenticated faculty member
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }

  /attendance/mark:
    post:
      tags: [Attendance]
      summary: Mark attendance for a subject session
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attendance/history:
    get:
      tags: [Attendance]
      summary: List authorized attendance history
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { in: query, name: studentId, schema: { type: string, format: objectId } }
        - { in: query, name: subjectId, schema: { type: string, format: objectId } }
        - { in: query, name: classId, schema: { type: string, format: objectId } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses: { '200': { $ref: '#/components/responses/PaginatedSuccess' } }
  /attendance/session-roster:
    get:
      tags: [Attendance]
      summary: Get a subject session roster
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /attendance/pending:
    get:
      tags: [Attendance]
      summary: Get today’s pending faculty attendance sessions
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /attendance/{id}:
    patch:
      tags: [Attendance]
      summary: Edit an authorized attendance entry
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { $ref: '#/components/responses/Success' } }

  /qr/generate:
    post:
      tags: [QR attendance]
      summary: Generate an expiring QR attendance session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, date, periodOrder]
              properties:
                subjectId: { type: string, format: objectId }
                date: { type: string, format: date-time }
                periodOrder: { type: integer, minimum: 1 }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /qr/scan:
    post:
      tags: [QR attendance]
      summary: Scan an active QR session as a student
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string, writeOnly: true } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /qr/stats:
    get:
      tags: [QR attendance]
      summary: Read live QR-session attendance statistics
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }

  /reports/subject/{subjectId}:
    get:
      tags: [Reports]
      summary: Export a subject attendance report
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: subjectId, in: path, required: true, schema: { type: string, format: objectId } }
        - { in: query, name: format, schema: { type: string, enum: [pdf, excel, xlsx], default: pdf } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: PDF or XLSX binary export, content: { application/pdf: {}, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
  /reports/student/{studentId}:
    get:
      tags: [Reports]
      summary: Export an authorized student attendance report
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: objectId } }
        - { in: query, name: format, schema: { type: string, enum: [pdf, excel, xlsx], default: pdf } }
      responses:
        '200': { description: PDF or XLSX binary export }
  /reports/class/{classId}/monthly:
    get:
      tags: [Reports]
      summary: Export a class monthly attendance report
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: path, required: true, schema: { type: string, format: objectId } }
        - { in: query, name: year, schema: { type: integer, minimum: 2000, maximum: 2200 } }
        - { in: query, name: month, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { in: query, name: format, schema: { type: string, enum: [pdf, excel, xlsx], default: pdf } }
      responses:
        '200': { description: PDF or XLSX binary export }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /search:
    get:
      tags: [Search]
      summary: Search authorized people, classes, subjects, and departments
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: objectId }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      in: query
      name: search
      schema: { type: string, maxLength: 80 }
  schemas:
    RegisterStudentRequest:
      type: object
      required: [name, email, password, classId]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        registerNumber: { type: string, maxLength: 80 }
        phone: { type: string, maxLength: 40 }
        classId: { type: string, format: objectId }
        password: { type: string, format: password, minLength: 12, writeOnly: true }
    OtpRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, minLength: 4, maxLength: 8, writeOnly: true }
    RegistrationRequest:
      allOf:
        - $ref: '#/components/schemas/RegisterStudentRequest'
    AuthSuccess:
      type: object
      properties:
        success: { type: boolean }
        accessToken: { type: string, readOnly: true }
        user: { $ref: '#/components/schemas/SafeUser' }
    SafeUser:
      type: object
      description: User representation with password hashes, OTPs, lockout internals, and reset flags excluded.
      properties:
        id: { type: string, format: objectId }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [student, faculty, hod, super_admin] }
        isActive: { type: boolean }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        pages: { type: integer }
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { type: object, additionalProperties: true }
    PaginatedSuccess:
      description: Successful paginated operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data:
                type: object
                properties:
                  pagination: { $ref: '#/components/schemas/Pagination' }
                additionalProperties: true
    BadRequest:
      description: Validation or malformed-input error
    Unauthorized:
      description: Missing, invalid, expired, revoked, or insufficient authentication
    Forbidden:
      description: Authenticated user lacks the required role or object-level access
    NotFound:
      description: Resource not found
    Conflict:
      description: State or uniqueness conflict
    RateLimited:
      description: Rate limit or progressive account lockout; check Retry-After when present
    PayloadTooLarge:
      description: Synchronous export exceeds MAX_REPORT_ROWS
