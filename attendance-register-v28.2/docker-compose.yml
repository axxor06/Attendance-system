version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: attendance-server
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/attendance_register
      CLIENT_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      ALLOW_LAN_ORIGINS: 'true'
      REFRESH_COOKIE_SECURE: 'false'
      REFRESH_COOKIE_SAMESITE: lax

    ports:
      - "5000:5000"

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - attendance-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: attendance-client
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      server:
        condition: service_healthy

    networks:
      - attendance-network

  mongo:
    image: mongo:7
    container_name: attendance-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: attendance_register

    volumes:
      - mongo-data:/data/db

    ports:
      - "27017:27017"

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - attendance-network

volumes:
  mongo-data:

networks:
  attendance-network:
    driver: bridge