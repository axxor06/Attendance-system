  /departments/public-options:
    get:
      tags: [Departments]
      summary: Return minimal active departments for public faculty requests
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /departments:
    get:
      tags: [Departments]
      summary: List departments
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/PaginatedSuccess' } }
    post:
      tags: [Departments]
      summary: Create a department
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentInput' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /semesters:
    get:
      tags: [Semesters]
      summary: List semesters
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
