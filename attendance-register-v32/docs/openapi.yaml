  /assignment-requests:
    get:
      tags: [Assignment requests]
      summary: List Faculty inability requests in the caller scope
      description: HOD sees the institution queue; Faculty sees only requests they submitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, rejected] } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Assignment requests]
      summary: Report inability for the authenticated Faculty member’s exact timetable slot
      description: The server resolves the current slot assignment and rejects stale, cross-Faculty, break, or duplicate pending requests.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timetableId, dayOfWeek, slotId, reason]
              properties:
                timetableId: { type: string, format: objectId }
                dayOfWeek: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
                slotId: { type: string, format: objectId }
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /assignment-requests/{id}/decision:
    patch:
      tags: [Assignment requests]
      summary: Accept or reject an assignment-request decision as HOD
      description: Acceptance requires an active replacement Faculty member who is still free at the exact slot. Rejection requires a written reason and leaves the current timetable assignment unchanged. Timetable and request changes commit atomically.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, rejected] }
                replacementFaculty: { type: string, format: objectId }
                decisionReason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /subjects:
    get:
