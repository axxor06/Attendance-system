openapi: 3.1.0
info:
  title: College Attendance Management API
  version: 1.0.0
  description: |
    REST API for Attendance Register, the college attendance management system. Canonical internal roles are `super_admin` (HOD), `admin` (Faculty), and `user` (Student). Public registration status uses a short, expiring reference code; only its hash is stored. Access tokens are sent
    as `Authorization: Bearer <token>`. Refresh tokens are rotated and stored in
    an HTTP-only cookie; clients must not read or persist refresh-token values.
servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://attendance.example.edu/api
    description: Production example

tags:
  - name: Authentication
  - name: Registration
  - name: Classes
  - name: Departments
  - name: Semesters
  - name: Subjects
  - name: Users
  - name: Attendance
  - name: QR attendance
  - name: Reports
  - name: Timetables
  - name: Leave requests
  - name: Assignment requests
  - name: Messages
  - name: Search

paths:
  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify a student email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend an email or password-reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                purpose: { type: string, enum: [email_verification, password_reset] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in and issue an access token plus rotated refresh cookie
      description: |
        Account-aware progressive login protection applies after repeated failures.
        A locked account returns HTTP 429 with a retry hint. Accounts with
        `passwordResetRequired` may authenticate only to receive the safe first-login signal and must complete the password-change flow before workspace access. HOD-managed resets clear this flag and return a permanent credential once to the authorized HOD. Passwordless managed accounts use the email OTP setup flow first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200':
          description: Signed in; refresh token is set in an HTTP-only cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh session and issue a new access token
      security: [{ refreshCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh session
      security: [{ refreshCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-reset-otp:
    post:
      tags: [Authentication]
      summary: Verify a password-reset OTP without consuming it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 4, maxLength: 8, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Consume a reset OTP and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 4, maxLength: 8 }
                newPassword: { type: string, format: password, minLength: 12, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Authentication]
      summary: Update role-permitted authenticated profile fields
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, description: Editable by HOD }
                phone: { type: string, maxLength: 40 }
                employeeId: { type: string, maxLength: 80, description: Editable by HOD }
                dateOfBirth: { type: string, format: date, description: Editable by HOD }
                avatarUrl: { type: string, format: uri, description: Editable by HOD and Faculty; Student registration photo is immutable }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/me/email-change:
    post:
      tags: [Authentication]
      summary: Request an email change; sends an OTP to the new address and alerts the current one
      description: Does not modify the account's email until confirmed via /auth/me/email-change/confirm.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail]
              properties:
                newEmail: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me/email-change/confirm:
    post:
      tags: [Authentication]
      summary: Confirm a pending email change with the OTP sent to the new address
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me/email-change/cancel:
    post:
      tags: [Authentication]
      summary: Cancel a pending email change
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password and invalidate current access/refresh sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, writeOnly: true }
                newPassword: { type: string, format: password, minLength: 12, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      summary: List users in the caller’s authorized directory scope
      description: HOD-only directory filters are server-validated. `tutorsOnly=true` returns active Faculty assigned as class tutors and includes their assigned class names and IDs. Sorting by department, semester, or class uses server-side academic joins; credentials and session fields are excluded.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [admin, user, faculty, student] } }
        - { name: department, in: query, schema: { type: string, format: objectId } }
        - { name: classId, in: query, schema: { type: string, format: objectId } }
        - { name: semester, in: query, schema: { type: string, format: objectId } }
        - { name: tutorsOnly, in: query, schema: { type: boolean, default: false } }
        - { name: sortBy, in: query, schema: { type: string, enum: [name, department, semester, class, createdAt], default: name } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/assigned-students:
    get:
      tags: [Users]
      summary: List students assigned to the authenticated Faculty
      description: Results are derived server-side from active subject assignments; client-provided department or class filters cannot expand the result.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
        - { name: classId, in: query, schema: { type: string, format: objectId } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Generate a one-time permanent credential for an authorized managed user
      description: |
        HOD may reset an in-scope managed account. The response contains the permanent
        credential exactly once. The server stores only its bcrypt hash, revokes existing
        sessions, clears `passwordResetRequired`, and never emails, logs, or returns the
        credential in a later request.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Permanent credential generated; plaintext is shown once to the authorized operator.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    required: [resetCredential, passwordIsPermanent]
                    properties:
                      resetCredential:
                        type: string
                        writeOnly: true
                        minLength: 12
                        description: One-time permanent credential; never persist or log this value.
                      passwordIsPermanent: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /timetables:
    get:
      tags: [Timetables]
      summary: List class-specific department-semester timetables in the caller scope
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: department, in: query, schema: { type: string, format: objectId } }
        - { name: semester, in: query, schema: { type: string, format: objectId } }
        - { name: classId, in: query, schema: { type: string, format: objectId } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /timetables/availability:
    get:
      tags: [Timetables]
      summary: List active Faculty available for a timetable slot
      description: HOD-only; availability is calculated server-side from active Faculty in the selected class department and exact overlapping class assignments. Busy Faculty are omitted. The query `classId` is a class identifier, while the response `data.timetableId` is the persisted timetable-document identifier resolved for that class. Optional `subjectId` is validated against the selected class for diagnostic context; it does not bypass department scope. Every persisted timetable slot has a unique Mongo ObjectId at `days[].slots[]._id`; the hypothetical requested slot supplies only day/order/time, and each persisted candidate slot’s explicit `faculty` is compared with the candidate Faculty being evaluated. During an edit, the server verifies `excludeTimetableId` against the resolved active timetable and optional `slotId` against that raw document, so the current record/slot is not treated as an external conflict; all other overlaps are still checked. Missing, malformed, stale, or cross-class slot IDs remain rejected.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: classId, in: query, required: true, schema: { type: string, format: objectId } }
        - { name: subjectId, in: query, required: false, schema: { type: string, format: objectId }, description: Optional active subject identifier; must belong to classId when supplied. }
        - { name: dayOfWeek, in: query, required: true, schema: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] } }
        - { name: order, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: startTime, in: query, schema: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' } }
        - { name: endTime, in: query, schema: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' } }
        - { name: excludeTimetableId, in: query, schema: { type: string, format: objectId }, description: Existing timetable identifier being edited. }
        - { name: slotId, in: query, schema: { type: string, format: objectId }, description: Existing slot identifier being edited; other overlapping assignments remain in the check. }
      responses:
        '200':
          description: Availability diagnostics and safe Faculty options
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [faculty, availableFaculty, eligibleFacultyCount, busyFacultyCount, availableFacultyCount]
                    properties:
                      faculty: { type: array, items: { $ref: '#/components/schemas/FacultyAvailabilityOption' } }
                      availableFaculty: { type: array, items: { $ref: '#/components/schemas/FacultyAvailabilityOption' } }
                      eligibleFacultyCount: { type: integer, minimum: 0 }
                      busyFacultyCount: { type: integer, minimum: 0 }
                      availableFacultyCount: { type: integer, minimum: 0 }
                      requestedSlot: { type: object, additionalProperties: true }
                      timetableId: { type: string, format: objectId, nullable: true }
                      slotId: { type: string, format: objectId, nullable: true }
                      scope: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /timetables/{classId}:
    get:
      tags: [Timetables]
      summary: Fetch one class timetable with persisted timetable and slot identifiers
      security: [{ bearerAuth: [] }]
      parameters: [{ name: classId, in: path, required: true, schema: { type: string, format: objectId } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Timetables]
      summary: Replace a class timetable
      description: HOD-only; each subject/faculty slot is validated. The server resolves the active timetable from the class route, excludes that exact timetable document and class from external comparisons, and keeps same-week overlapping assignments as internal conflicts. Genuine overlaps in other classes remain HTTP 409 with bounded conflict details; development diagnostics separate internal and external counts and include exact IDs and time ranges.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: classId, in: path, required: true, schema: { type: string, format: objectId } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: array, maxItems: 7, items: { type: object } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Faculty occupancy or uniqueness conflict. Timetable occupancy responses use code TIMETABLE_CONFLICT and a bounded details array with exact current and conflicting assignment context.
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success: { type: boolean, example: false }
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [TIMETABLE_CONFLICT, CONFLICT] }
                      message: { type: string, example: 2 timetable assignments conflict with existing Faculty schedules. }
                  details:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/TimetableConflictDetail' }
                  requestId: { type: string }
  /leave-requests:
    get:
      tags: [Leave requests]
      summary: List leave requests in the caller’s Student, tutor, or HOD scope
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Leave requests]
      summary: Submit a Student leave request to the current tutor and HOD
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /leave-requests/{id}/decision:
    patch:
      tags: [Leave requests]
      summary: Approve or reject a leave request in tutor/HOD scope
      description: Rejection requires a bounded written reason; the operation is atomic and one-time.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                decisionReason: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /registration-requests:
    post:
      tags: [Registration]
      summary: Submit a student or faculty registration request for HOD approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Registration]
      summary: List registration requests for review
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, all], default: pending }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /registration-requests/status:
    get:
      tags: [Registration]
      summary: Check public registration-request status with a short reference
      parameters:
        - in: query
          name: code
          required: false
          description: Short public status reference returned once after submission, for example AR-7K4P-92XM.
          schema: { type: string, pattern: '^AR-[A-Z0-9]{4}-[A-Z0-9]{6}$' }
        - in: query
          name: requestId
          required: false
          schema: { type: string, format: objectId }
        - in: query
          name: statusToken
          required: false
          schema: { type: string, minLength: 32, maxLength: 128, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { description: Status reference expired }
        '429': { $ref: '#/components/responses/RateLimited' }
  /registration-requests/{id}/approve:
    post:
      tags: [Registration]
      summary: Approve a pending registration request with a HOD-assigned identifier
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, minLength: 2, maxLength: 80, description: Register number for Students or employee ID for Faculty; checked for uniqueness by the server. }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /registration-requests/{id}/reject:
    post:
      tags: [Registration]
      summary: Reject a pending registration request
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, minLength: 5, maxLength: 500 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }

  /users/{id}/summary:
    get:
      tags: [Users]
      summary: Read an authorized student or faculty profile summary
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/reset-device:
    post:
      tags: [Users]
      summary: Reset an authorized student’s bound device and revoke sessions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /uploads/registration-photo:
    post:
      tags: [Users]
      summary: Upload an optional student registration profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: JPG, PNG, or WebP; maximum 3 MB }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Image upload service not configured }
  /uploads/profile-photo:
    post:
      tags: [Users]
      summary: Upload an authenticated profile photo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: JPG, PNG, or WebP; maximum 3 MB }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /classes/public-options:
    get:
      tags: [Classes]
      summary: Return active classes for public registration
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /classes:
    get:
      tags: [Classes]
      summary: List classes
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Search' }
        - { in: query, name: department, schema: { type: string, format: objectId } }
        - { in: query, name: semester, schema: { type: string, format: objectId } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
    post:
      tags: [Classes]
      summary: Create a class
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /classes/{id}:
    get:
      tags: [Classes]
      summary: Get a class
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    patch:
      tags: [Classes]
      summary: Update a class
