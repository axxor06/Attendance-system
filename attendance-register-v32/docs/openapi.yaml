  /search:
    get:
      tags: [Search]
      summary: Search authorized people, classes, subjects, and departments
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }

  /messages/recipients:
    get:
      tags: [Messages]
      summary: List active recipients allowed for the caller
      description: Recipient scope is derived from current HOD, Faculty teaching/tutor, Student class, Subject, and timetable relationships. Client role or class claims are ignored. Students receive one deterministic active HOD and their class Tutor; Faculty may contact active Faculty peers plus relationship-scoped Students, HODs, and Tutors. Search results are contact discovery only and never create conversations.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: group, in: query, schema: { type: string, enum: [all, students, faculty, hod, tutors], default: all }, description: Server-filtered recipient category applied before pagination. }
        - { name: search, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /messages/profiles/{userId}:
    get:
      tags: [Messages]
      summary: Read a safe profile for an authorized messaging recipient
      description: Access is rechecked against the current relationship scope. The response contains role-appropriate academic details and never contains passwords, hashes, OTPs, refresh tokens, or device hashes.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: objectId } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /messages/conversations:
    get:
      tags: [Messages]
      summary: List the caller's direct conversations
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Messages]
      summary: Find or create a direct conversation with an authorized recipient
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId: { type: string, format: objectId }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /messages/conversations/{conversationId}/messages:
    get:
      tags: [Messages]
      summary: Read a paginated direct-message thread
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: objectId } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Messages]
      summary: Send a text message to a direct thread
      description: The server rechecks conversation membership and the active recipient relationship before writing the bounded text message.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: objectId } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /messages/conversations/{conversationId}/messages/{messageId}:
    patch:
      tags: [Messages]
      summary: Edit a message sent by the authenticated caller
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/MessageId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Messages]
      summary: Delete a message sent by the authenticated caller
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { $ref: '#/components/parameters/MessageId' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /messages/conversations/{conversationId}/read:
    patch:
      tags: [Messages]
      summary: Mark received messages in a direct thread as read
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: objectId } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: objectId }
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema: { type: string, format: objectId }
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string, format: objectId }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      in: query
      name: search
      schema: { type: string, maxLength: 80 }
  schemas:
    DepartmentInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: string, maxLength: 10 }
        description: { type: string, maxLength: 500 }
        programLevel: { type: string, enum: [certificate, diploma, degree, postgraduate, other], default: degree }
        semesterCount: { type: integer, minimum: 1, maximum: 20, default: 8 }
    SemesterInput:
      type: object
      required: [number]
      properties:
        number: { type: integer, minimum: 1, maximum: 20 }
        label: { type: string, maxLength: 80 }
        departmentId: { type: string, format: objectId, description: Required for HOD-created semesters }
    RegisterStudentRequest:
      type: object
      required: [name, email, password]
      description: Use requestedRole=student with classId for a student request, or requestedRole=faculty with employeeId and departmentId for a faculty request.
      properties:
        requestedRole: { type: string, enum: [student, faculty], default: student }
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        registerNumber: { type: string, maxLength: 80 }
        employeeId: { type: string, maxLength: 80 }
        phone: { type: string, maxLength: 40 }
        dateOfBirth: { type: string, format: date, description: Date-only YYYY-MM-DD value; must not be future }
        avatarUrl: { type: string, format: uri, readOnly: true }
        classId: { type: string, format: objectId, description: Required when requestedRole is student }
        departmentId: { type: string, format: objectId, description: Required when requestedRole is faculty }
        password: { type: string, format: password, minLength: 12, writeOnly: true }
        confirmPassword: { type: string, format: password, writeOnly: true }
    OtpRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, minLength: 4, maxLength: 8, writeOnly: true }
    RegistrationRequest:
      allOf:
        - $ref: '#/components/schemas/RegisterStudentRequest'
    AuthSuccess:
      type: object
      properties:
        success: { type: boolean }
        accessToken: { type: string, readOnly: true }
        user: { $ref: '#/components/schemas/SafeUser' }
    SafeUser:
      type: object
      description: User representation with password hashes, OTPs, lockout internals, and reset flags excluded.
      properties:
        id: { type: string, format: objectId }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [super_admin, admin, user], description: Canonical internal value; UI labels are HOD, Faculty, and Student }
        isActive: { type: boolean }
        dateOfBirth: { type: string, format: date, readOnly: true }
        age: { type: integer, minimum: 0, readOnly: true }
        avatarUrl: { type: string, format: uri, readOnly: true }
    TimetableConflictDetail:
      type: object
      description: Safe timetable assignment conflict detail. Credentials, tokens, and database internals are excluded.
      required: [facultyId, dayOfWeek, order, reason]
      properties:
        facultyId: { type: string, format: objectId }
        facultyName: { type: string }
        currentClassId: { type: string, format: objectId }
        currentClassName: { type: string }
        currentTimetableId: { type: string, format: objectId, nullable: true }
        conflictingTimetableId: { type: string, format: objectId }
        conflictingClassId: { type: string, format: objectId }
        conflictingClassName: { type: string }
        dayOfWeek: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        order: { type: integer, minimum: 1 }
        currentOrder: { type: integer, minimum: 1 }
        conflictingOrder: { type: integer, minimum: 1 }
        currentStartTime: { type: string, nullable: true }
        currentEndTime: { type: string, nullable: true }
        conflictingStartTime: { type: string, nullable: true }
        conflictingEndTime: { type: string, nullable: true }
        currentSlotId: { type: string, format: objectId, nullable: true }
        conflictingSlotId: { type: string, format: objectId, nullable: true }
        reason: { type: string }
    FacultyAvailabilityOption:
      type: object
      description: Safe active Faculty option returned for a selected class department; security metadata is excluded.
      required: [_id, name]
      properties:
        _id: { type: string, format: objectId }
        name: { type: string }
        employeeId: { type: string }
        department:
          type: object
          properties:
            _id: { type: string, format: objectId }
            name: { type: string }
            code: { type: string }
    MessageRecipient:
      type: object
      required: [_id, name, role, roleLabel]
      properties:
        _id: { type: string, format: objectId }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [super_admin, admin, user] }
        roleLabel: { type: string, enum: [HOD, Faculty, Student] }
        avatarUrl: { type: string, format: uri, nullable: true }
        employeeId: { type: string, nullable: true }
        registerNumber: { type: string, nullable: true }
    Message:
      type: object
      required: [_id, conversation, sender, recipient, body, createdAt]
      properties:
        _id: { type: string, format: objectId }
        conversation: { type: string, format: objectId }
        sender: { type: string, format: objectId }
        recipient: { type: string, format: objectId }
        body: { type: string, maxLength: 5000 }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [_id, recipient, unreadCount]
      properties:
        _id: { type: string, format: objectId }
        recipient: { $ref: '#/components/schemas/MessageRecipient' }
        lastMessage:
          type: object
          nullable: true
          properties:
            preview: { type: string, maxLength: 180 }
            sentAt: { type: string, format: date-time }
            sender: { type: string, format: objectId }
        unreadCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        pages: { type: integer }
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data: { type: object, additionalProperties: true }
    PaginatedSuccess:
      description: Successful paginated operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              data:
                type: object
                properties:
                  pagination: { $ref: '#/components/schemas/Pagination' }
                additionalProperties: true
    BadRequest:
      description: Validation or malformed-input error
    Unauthorized:
      description: Missing, invalid, expired, revoked, or insufficient authentication
    Forbidden:
      description: Authenticated user lacks the required role or object-level access
    NotFound:
      description: Resource not found
    Conflict:
      description: State or uniqueness conflict. Some timetable conflicts include a bounded details array with safe occupancy context.
    RateLimited:
      description: Rate limit or progressive account lockout; check Retry-After when present
    PayloadTooLarge:
      description: Synchronous export exceeds MAX_REPORT_ROWS
